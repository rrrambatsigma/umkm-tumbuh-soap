name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-service:
    name: Auth Service / Go
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/auth-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/auth-service/go.mod
          cache-dependency-path: services/auth-service/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Check Go formatting
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Build auth-service
        run: go build ./...

  user-service:
    name: User Service / Go
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/user-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/user-service/go.mod
          cache-dependency-path: services/user-service/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Check Go formatting
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Build user-service
        run: go build ./...

  authorization-services:
    name: ${{ matrix.service }} / Go
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [partnerships-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/partnerships-service/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Download Go dependencies
        run: go mod download
      - name: Check Go formatting
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Run authorization regressions with race detection
        run: go test -race ./...
      - name: Build service
        run: go build ./...

  frontend:
    name: Frontend / React Vite
    timeout-minutes: 10
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check TypeScript and build frontend
        run: npm run build

      - name: Run login regressions
        run: npm run test:login

      - name: Run development proxy regressions
        run: npm run test:proxy

      - name: Run page and registration upload regressions
        run: npm run test:pages

  infra:
    name: Infrastructure / Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate docker-compose config
        run: docker compose --env-file .env.example -f infra/docker-compose.yml config
