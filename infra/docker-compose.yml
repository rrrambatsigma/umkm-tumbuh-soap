x-api-healthcheck: &api-healthcheck
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 15s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umkm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umkm_password}
      POSTGRES_DB: ${POSTGRES_DB:-umkm_tumbuh}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - umkm_network

  db-migrate:
    build:
      context: ./db
      dockerfile: migrator/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-umkm_user}:${POSTGRES_PASSWORD:-umkm_password}@postgres:5432/${POSTGRES_DB:-umkm_tumbuh}?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - umkm_network
    restart: "no"

  auth-seed-admin:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-umkm_user}:${POSTGRES_PASSWORD:-umkm_password}@postgres:5432/${POSTGRES_DB:-umkm_tumbuh}?sslmode=disable
      ADMIN_ID: ${ADMIN_ID:-AKUNADMIN001}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Admin Pemerintah}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    command: ["/app/auth-seed-admin"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - umkm_network
    restart: "no"

  db-seed:
    image: postgres:16-alpine
    profiles:
      - seed
    working_dir: /app/data
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-umkm_user}:${POSTGRES_PASSWORD:-umkm_password}@postgres:5432/${POSTGRES_DB:-umkm_tumbuh}?sslmode=disable
    volumes:
      - ./db/loaders:/app/loaders:ro
      - ./db/dummy/seed-csv:/app/data:ro
    command:
      - sh
      - -c
      - |
        set -e
        echo "Loading committed dummy CSV dataset..."
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f /app/loaders/load_generated_csv.sql
        echo "Dummy CSV dataset loaded successfully."
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - umkm_network
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_HTTP_PORT:-8025}:8025" # Web UI
    networks:
      - umkm_network

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-umkm_user}:${POSTGRES_PASSWORD:-umkm_password}@postgres:5432/${POSTGRES_DB:-umkm_tumbuh}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      USER_SERVICE_URL: http://user-service:8081
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@umkm-tumbuh.local}
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/db"]
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${AUTH_SERVICE_PORT:-8080}:8080"
    depends_on:
      auth-seed-admin:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    networks:
      - umkm_network

  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      USER_SERVICE_HOST: 0.0.0.0
      USER_SERVICE_PORT: 8081
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-umkm_user}:${POSTGRES_PASSWORD:-umkm_password}@postgres:5432/${POSTGRES_DB:-umkm_tumbuh}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /app/uploads
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/api/v1/health/db"]
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${USER_SERVICE_PORT:-8081}:8081"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - umkm_network

  garage:
    image: dxflrs/garage:v2.0.0
    restart: unless-stopped
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-CHANGE_ME_LOCAL_GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${GARAGE_S3_PORT:-3900}:3900" # S3 API
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${GARAGE_ADMIN_PORT:-3903}:3903" # admin API
    networks:
      - umkm_network

  partnerships-service:
    build:
      context: ../services/partnerships-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8082
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-umkm_user}:${POSTGRES_PASSWORD:-umkm_password}@postgres:5432/${POSTGRES_DB:-umkm_tumbuh}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health"]
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${PARTNERSHIP_SERVICE_PORT:-8082}:8082"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - umkm_network

  garage-bootstrap:
    build:
      context: ./garage
    restart: "no"
    depends_on:
      garage:
        condition: service_started
    volumes:
      - garage_credentials:/run/garage
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-CHANGE_ME_LOCAL_GARAGE_ADMIN_TOKEN}
      OBJECT_STORAGE_BUCKET_DOCUMENTS: ${OBJECT_STORAGE_BUCKET_DOCUMENTS:-documents}
      OBJECT_STORAGE_BUCKET_PARTNERSHIP_FILES: ${OBJECT_STORAGE_BUCKET_PARTNERSHIP_FILES:-partnership-files}
    networks:
      - umkm_network

  document-service:
    build:
      context: ../services/document-service
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint:
      - sh
      - -ec
      - |
        test -r /run/garage/garage.env || { echo "Garage credentials are missing; run garage-bootstrap first." >&2; exit 1; }
        set -a
        . /run/garage/garage.env
        set +a
        : "$${OBJECT_STORAGE_ACCESS_KEY:?Missing Garage access key}"
        : "$${OBJECT_STORAGE_SECRET_KEY:?Missing Garage secret key}"
        exec /app/document-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DOCUMENT_SERVICE_HOST: 0.0.0.0
      DOCUMENT_SERVICE_PORT: 8083
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-umkm_user}:${POSTGRES_PASSWORD:-umkm_password}@postgres:5432/${POSTGRES_DB:-umkm_tumbuh}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://garage:3900}
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:3900}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-garage}
      OBJECT_STORAGE_USE_SSL: ${OBJECT_STORAGE_USE_SSL:-false}
      OBJECT_STORAGE_BUCKET_DOCUMENTS: ${OBJECT_STORAGE_BUCKET_DOCUMENTS:-documents}
      OBJECT_STORAGE_BUCKET_CERTIFICATES: ${OBJECT_STORAGE_BUCKET_CERTIFICATES:-certificates}
      OBJECT_STORAGE_BUCKET_PRODUCT_IMAGES: ${OBJECT_STORAGE_BUCKET_PRODUCT_IMAGES:-product-images}
      OBJECT_STORAGE_BUCKET_PARTNERSHIP_FILES: ${OBJECT_STORAGE_BUCKET_PARTNERSHIP_FILES:-partnership-files}
    volumes:
      - type: volume
        source: garage_credentials
        target: /run/garage
        read_only: true
        volume:
          nocopy: true
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/api/v1/health"]
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${DOCUMENT_SERVICE_PORT:-8083}:8083"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      garage:
        condition: service_started
      garage-bootstrap:
        condition: service_completed_successfully
    networks:
      - umkm_network

  soap-partnerships-service:
    build:
      context: ../services/soap-partnerships-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-umkm_user}:${POSTGRES_PASSWORD:-umkm_password}@postgres:5432/${POSTGRES_DB:-umkm_tumbuh}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      SOAP_PORT: ${SOAP_SERVICE_PORT:-9090}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:9090/partnership?wsdl' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${SOAP_SERVICE_PORT:-9090}:9090"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - umkm_network

volumes:
  postgres_data:
  uploads_data:
  garage_data:
  garage_credentials:

networks:
  umkm_network:
    driver: bridge
